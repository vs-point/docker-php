name: Docker

# Staví image vspoint/php z php/<tag>/Dockerfile (generuje je generate.py z versions.json)
# pro linux/amd64 i linux/arm64 a pushuje je na Docker Hub.
#
# Co se staví:
#   - push do master / pull request: jen image, jejichž php/<tag>/ se změnil
#     (změna tohoto workflow = všechny podporované)
#   - automaticky 1. den v měsíci: všechny podporované (ne "eol") verze načisto bez cache,
#     aby obsahovaly nejnovější patch verzi PHP a bezpečnostní opravy základních image
#   - ručně (Actions -> Docker -> Run workflow): podporované, "all" = úplně všechny,
#     nebo vyjmenované tagy
# Pull requesty se jen staví a testují, nic se nepushuje.
#
# Potřebné secrets v repozitáři (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - uživatel Docker Hubu s právem zápisu do vspoint/php
#   DOCKERHUB_TOKEN    - jeho Personal access token s právy "Read & Write"

on:
  push:
    branches: [master]
    paths:
      - 'php/**'
      - 'versions.json'
      - 'generate.py'
      - 'patch-ds.sh'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'php/**'
      - 'versions.json'
      - 'generate.py'
      - 'patch-ds.sh'
      - '.github/workflows/docker.yml'
  schedule:
    # 1. den v měsíci ve 3:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tagy k sestavení oddělené mezerou (např. "8.5-fpm-alpine 7.4-fpm-alpine"), "all" = všechny, prázdné = podporované verze'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: vspoint/php
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  # plánovaný a ruční běh staví načisto, aby se natáhly aktualizace balíčků i bez nové verze PHP
  NO_CACHE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  matrix:
    name: Příprava
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      merge: ${{ steps.matrix.outputs.merge }}
    steps:
      - name: Kontrola přihlášení k Docker Hubu
        if: env.PUSH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Chybí přihlášení k Docker Hubu::V repozitáři chybí secrets:$missing. Vytvoř na app.docker.com (Account settings -> Personal access tokens) token s právy Read & Write a ulož ho v Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Kontrola vygenerovaných Dockerfilů
        run: |
          python3 generate.py > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error title=Neaktuální Dockerfily::Soubory v php/ neodpovídají versions.json. Spusť ./generate.py a commitni výsledek."
            exit 1
          fi

      - name: Výběr image
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAGS: ${{ inputs.tags }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(python3 generate.py --list)
          supported=$(jq -c '[.[] | select(.eol | not) | .tag]' <<< "$all")

          case "$EVENT" in
            schedule)
              tags="$supported" ;;
            workflow_dispatch)
              if [ -z "$INPUT_TAGS" ]; then
                tags="$supported"
              elif [ "$INPUT_TAGS" = all ]; then
                tags=$(jq -c '[.[].tag]' <<< "$all")
              else
                tags=$(jq -c -R 'split(" ") | map(select(. != ""))' <<< "$INPUT_TAGS")
              fi ;;
            *)
              if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                tags="$supported"
              else
                changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
                # jen existující tagy - smazané nebo přejmenované adresáře se ignorují
                tags=$(grep -oP '^php/\K[^/]+(?=/)' <<< "$changed" | sort -u \
                  | jq -c -R -s --argjson all "$all" 'split("\n") | map(select(. as $t | [$all[].tag] | index($t)))')
                if grep -q '^.github/workflows/docker.yml$' <<< "$changed"; then
                  tags=$(jq -c -n --argjson a "$tags" --argjson b "$supported" '$a + $b | unique')
                fi
              fi ;;
          esac

          unknown=$(jq -r -n --argjson t "$tags" --argjson all "$all" '$t - [$all[].tag] | join(" ")')
          if [ -n "$unknown" ]; then
            echo "::error title=Neznámý tag::$unknown (tagy jsou v ./generate.py --list)"
            exit 1
          fi

          merge=$(jq -c -n --argjson t "$tags" --argjson all "$all" '[$all[] | select(.tag as $x | $t | index($x))]')
          build=$(jq -c -n --argjson m "$merge" '[$m[] as $m | (
            {"platform": "linux/amd64", "arch": "amd64", "runner": "ubuntu-24.04"},
            {"platform": "linux/arm64", "arch": "arm64", "runner": "ubuntu-24.04-arm"}
          ) as $p | $m + $p]')

          echo "Stavím: $(jq -r '[.[].tag] | join(" ")' <<< "$merge")"
          echo "### Image k sestavení" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- `\(.tag)`"' <<< "$merge" >> "$GITHUB_STEP_SUMMARY"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.build != '[]'
    name: ${{ matrix.tag }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Přihlášení k Docker Hubu
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: php/${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ env.NO_CACHE == 'true' }}
          cache-from: type=gha,scope=${{ matrix.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}-${{ matrix.arch }}
          load: true
          tags: test-image

      - name: Test image
        env:
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          docker run --rm -e EXTENSIONS test-image sh -ec '
            php -v
            errors=$(php -m 2>&1 >/dev/null; php -m | grep -iE "warning|error" || true)
            [ -z "$errors" ] || { echo "$errors"; exit 1; }
            for ext in $EXTENSIONS; do
              [ "$ext" = opcache ] && ext="Zend OPcache"
              php -m | grep -qix "$ext" || { echo "chybí rozšíření $ext"; exit 1; }
            done
            composer --version
            php-fpm -t
          '

      # použije lokální cache z kroku Build, takže se pushne přesně otestovaný image
      - name: Push ${{ matrix.arch }}
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: php/${{ matrix.tag }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Uložení digestu
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digestu
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.tag }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [matrix, build]
    # i když některý build selže, ostatní image se publikují
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.matrix.outputs.merge != '[]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    name: Publikace vspoint/php:${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.merge) }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.tag }}-*
          merge-multiple: true

      - run: mkdir -p /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - name: Přihlášení k Docker Hubu
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Spojení amd64 + arm64 a push tagu
        working-directory: /tmp/digests
        run: |
          if [ "$(find . -type f | wc -l)" -ne 2 ]; then
            echo "::error title=${{ matrix.tag }}::Build pro některou architekturu selhal, tag se nepublikuje."
            exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMAGE:${{ matrix.tag }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Souhrn
        run: |
          {
            echo "### \`$IMAGE:${{ matrix.tag }}\`"
            echo
            echo "Rozšíření: ${{ matrix.extensions }}"
            echo
            echo '```'
            docker buildx imagetools inspect "$IMAGE:${{ matrix.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub vypíná plánované workflow ve veřejném repozitáři po 60 dnech bez commitu.
  # Opětovné povolení při každém plánovaném běhu ho udrží aktivní.
  keepalive:
    name: Udržení plánovače
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow enable docker.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
