name: Docker

# Staví vspoint/php:<verze>-fpm-alpine(-production) pro linux/amd64 i linux/arm64
# podle versions.json a pushuje je na Docker Hub.
#
# Spouští se:
#   - po pushi do master (změna Dockerfile, versions.json nebo tohoto workflow)
#   - automaticky 1. den v měsíci - přestaví image načisto (bez cache) z aktuálních
#     základních image php:*, aby obsahovaly nejnovější patch verzi PHP a bezpečnostní opravy
#   - ručně: Actions -> Docker -> Run workflow
# Pull requesty se jen staví a testují, nic se nepushuje.
#
# Potřebné secrets v repozitáři (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME - uživatel Docker Hubu s právem zápisu do vspoint/php
#   DOCKERHUB_TOKEN    - jeho Personal access token se scope "Read & Write"

on:
  push:
    branches: [master]
    paths:
      - 'php/fpm-alpine/**'
      - 'versions.json'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'php/fpm-alpine/**'
      - 'versions.json'
      - '.github/workflows/docker.yml'
  schedule:
    # 1. den v měsíci ve 3:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: vspoint/php
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  # plánovaný a ruční běh staví načisto, aby se natáhly aktualizace balíčků i bez nové verze PHP
  NO_CACHE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  matrix:
    name: Příprava
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      merge: ${{ steps.matrix.outputs.merge }}
    steps:
      - name: Kontrola přihlášení k Docker Hubu
        if: env.PUSH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=Chybí přihlášení k Docker Hubu::V repozitáři chybí secrets:$missing. Vytvoř na app.docker.com (Account settings -> Personal access tokens) token s právy Read & Write a ulož ho v Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Sestavení matice verzí
        id: matrix
        run: |
          targets='[
            {"target": "development", "suffix": ""},
            {"target": "production", "suffix": "-production"}
          ]'
          platforms='[
            {"platform": "linux/amd64", "arch": "amd64", "runner": "ubuntu-24.04"},
            {"platform": "linux/arm64", "arch": "arm64", "runner": "ubuntu-24.04-arm"}
          ]'
          merge=$(jq -c --argjson t "$targets" \
            '[.[] as $v | $t[] as $t | $v + $t + {tag: ($v.php + "-fpm-alpine" + $t.suffix)}]' versions.json)
          build=$(jq -c -n --argjson m "$merge" --argjson p "$platforms" \
            '[$m[] as $m | $p[] as $p | $m + $p]')
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.tag }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Přihlášení k Docker Hubu
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: php/fpm-alpine
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: ${{ env.NO_CACHE == 'true' }}
          build-args: &build-args |
            PHP_IMAGE=${{ matrix.image }}
            DS_VERSION=${{ matrix.ds }}
            REDIS_VERSION=${{ matrix.redis }}
            XDEBUG_VERSION=${{ matrix.xdebug }}
          cache-from: type=gha,scope=${{ matrix.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}-${{ matrix.arch }}
          load: true
          tags: test-image

      - name: Test image
        run: |
          docker run --rm test-image sh -ec '
            php -v
            for ext in bcmath ds exif gd gmp intl pdo_mysql pdo_pgsql pgsql redis zip; do
              php -m | grep -qix "$ext" || { echo "chybí rozšíření $ext"; exit 1; }
            done
            if [ "${{ matrix.target }}" = development ]; then
              php -m | grep -qix xdebug || { echo "chybí xdebug"; exit 1; }
            fi
            php -r "echo (new NumberFormatter(\"cs_CZ\", NumberFormatter::CURRENCY))->formatCurrency(1234.5, \"CZK\"), PHP_EOL;"
            composer --version
            php-fpm -t
          '

      # použije lokální cache z kroku Build, takže se pushne přesně otestovaný image
      - name: Push ${{ matrix.arch }}
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: php/fpm-alpine
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: *build-args
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Uložení digestu
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digestu
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.tag }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [matrix, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    name: Publikace vspoint/php:${{ matrix.tag }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.merge) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.tag }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Přihlášení k Docker Hubu
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Spojení amd64 + arm64 a push tagu
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ matrix.tag }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Souhrn
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ matrix.tag }}"
          {
            echo "### \`$IMAGE:${{ matrix.tag }}\`"
            echo
            echo "- základ: \`${{ matrix.image }}\`, target: \`${{ matrix.target }}\`"
            echo "- ds \`${{ matrix.ds }}\`, redis \`${{ matrix.redis }}\`, xdebug \`${{ matrix.xdebug }}\`"
            echo
            echo '```'
            docker buildx imagetools inspect "$IMAGE:${{ matrix.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub vypíná plánované workflow ve veřejném repozitáři po 60 dnech bez commitu.
  # Opětovné povolení při každém plánovaném běhu ho udrží aktivní.
  keepalive:
    name: Udržení plánovače
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow enable docker.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
